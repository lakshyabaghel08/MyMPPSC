<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dashboard · MyMPPSC</title>
    <meta name="description" content="Local-first MPPSC State Service Preliminary Examination preparation app: previous-year paper simulations, topic practice, mistake book, adaptive revision, analytics and syllabus planning. Works offline." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f131c" />
    <meta name="theme-color" content="#f8fafc" id="themeColorMeta" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mymppsc.settings');
          var parsed = raw ? JSON.parse(raw) : null;
          var pref = (parsed && parsed.theme) || 'system';
          var isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-theme-pref', pref);
          root.setAttribute('data-density', (parsed && parsed.density) || 'comfortable');
          var meta = document.getElementById('themeColorMeta');
          if (meta) meta.setAttribute('content', isDark ? '#0f131c' : '#f8fafc');
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header" id="appHeader">
      <button class="btn btn-icon nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-controls="appNav" aria-expanded="false">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </span>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">MP</span>
        <div class="brand-text">
          <strong>MyMPPSC</strong>
          <span class="brand-sub">Prelims preparation · local-first</span>
        </div>
      </div>
      <div class="header-actions">
        <span class="offline-pill" id="offlinePill" role="status" hidden>Offline — all features still work</span>
        <span class="bank-pill" id="bankPill" title="Questions stored locally">Bank: —</span>
        <button class="command-trigger" id="commandBtn" type="button" aria-label="Search and navigate" title="Search and navigate (Ctrl+K)">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg></span>
          <span>Search</span><kbd>Ctrl K</kbd>
        </button>
        <button class="btn btn-primary btn-sm" id="quickStartBtn" type="button">Quick practice</button>
        <button class="btn btn-quiet btn-icon" id="themeToggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
          </span>
        </button>
        <button class="btn btn-quiet btn-icon" id="helpBtn" type="button" aria-label="Help and limitations" title="Help, keyboard shortcuts and limitations (?)">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="9" /><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5M12 16.5h.01" /></svg>
          </span>
        </button>
      </div>
    </header>

    <div class="app-body" id="appBody">
      <nav class="app-nav" id="appNav" aria-label="Main navigation">
        <ul id="navList"></ul>
        <div class="nav-footer">
          <div class="nav-foot-item"><span class="muted">Local store</span><strong id="navDataSummary">—</strong></div>
          <button class="btn btn-quiet btn-block" id="navBackupBtn" type="button">Backup now</button>
        </div>
      </nav>
      <div class="nav-scrim" id="navScrim" hidden aria-hidden="true"></div>

      <main class="app-main" id="main" tabindex="-1">
        <div class="sr-only" id="routeAnnouncer" aria-live="polite" aria-atomic="true"></div>
        <div class="view" id="view">
          <div class="loading-block" role="status" aria-busy="true">Loading local data…</div>
        </div>
      </main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>
    <div class="modal-root" id="modalRoot" hidden></div>

    <noscript>
      <p class="noscript">MyMPPSC needs JavaScript: all study features run locally in your browser.</p>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
